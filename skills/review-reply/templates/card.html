<!-- data-flag : 사과·확인이 필요한 건만 "sorry"(노란 줄), 하자·AS급이면 "as"(빨간 줄). 없으면 속성 자체를 뺀다. -->
<!-- data-month: 한달사용이면 1, 일반이면 0 / data-photo: 사진 있으면 1, 없으면 0 -->

    <!-- 행N -->
    <article class="rev" data-flag="sorry" data-month="1" data-photo="1">
      <div class="stripe"></div>
      <div>
        <div class="meta">
          <span class="rowno">행 NN</span><span class="tag month">한달사용</span>
          <span class="stars">★★★★★</span><span class="who">작성자ID · MM.DD</span>
        </div>
        <h2 class="prod">짧은 제품명 · 옵션</h2>
        <blockquote class="text">리뷰 원문 그대로</blockquote>
        <div class="prior"><em>첫 리뷰</em> · M열 첫 리뷰 원문 (한달사용일 때만)</div>
        <figure><button type="button" data-full="__IMGN__"><img src="__IMGN__" alt="행N 리뷰 사진"></button></figure>
      </div>
      <div class="reply-col">
        <div class="rhead"><span class="lbl">답글</span><button class="copy">복사</button></div>
        <div class="reply">답글 본문 첫 줄
답글 본문...

[플레르가구]
고객센터 : 010-8981-0097
인스타 : @_plaire_official</div>
        <p class="note">담당자에게만 보이는 메모 (필요할 때만)</p>
      </div>
    </article>
